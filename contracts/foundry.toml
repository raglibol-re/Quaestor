[profile.default]
src = "src"
out = "out"
test = "test"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = true
# "shanghai" (not "cancun") so the bytecode avoids MCOPY / transient-storage opcodes and
# deploys on the broadest set of EVM chains (Sepolia, Base Sepolia, Tempo, ...).
evm_version = "shanghai"
fs_permissions = [{ access = "read", path = "./" }]

[fuzz]
runs = 256

[invariant]
runs = 64
depth = 64
fail_on_revert = false
